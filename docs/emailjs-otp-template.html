<!--
  Azure Bay — EmailJS OTP / verification template
  Paste into EmailJS → Email Templates → Content (HTML)

  Settings → To Email:  {{to_email}}
  Settings → To Name:   {{to_name}}
  Settings → From Name: {{hotel_name}}
  Subject: Your verification code — {{hotel_name}}

  Variables sent by the app (frontend/src/lib/emailjs.js → sendOtpEmail):
  to_email, to_name, otp_code, hotel_name,
  invoice_number, total, lines, status  (compat aliases for the invoice template)

  Optional env: VITE_EMAILJS_OTP_TEMPLATE_ID
  If unset, the app reuses VITE_EMAILJS_TEMPLATE_ID with the code in total/lines.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{hotel_name}} verification</title>
</head>
<body style="margin:0;padding:0;background-color:#faf8f4;-webkit-font-smoothing:antialiased;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#faf8f4;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;width:100%;background-color:#ffffff;border-radius:22px;overflow:hidden;border:1px solid rgba(11,31,51,0.08);">
          <tr>
            <td style="background-color:#0b1f33;padding:28px 32px 24px 32px;">
              <p style="margin:0 0 6px 0;font-family:Georgia,'Times New Roman',serif;font-size:28px;line-height:1.2;color:#f2c078;">
                {{hotel_name}}
              </p>
              <p style="margin:0;font-family:Inter,Arial,Helvetica,sans-serif;font-size:11px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:rgba(250,248,244,0.72);">
                Account verification
              </p>
            </td>
          </tr>
          <tr>
            <td style="height:3px;background-color:#f2c078;font-size:0;line-height:0;">&nbsp;</td>
          </tr>
          <tr>
            <td style="padding:32px;font-family:Inter,Arial,Helvetica,sans-serif;color:#0b1f33;">
              <p style="margin:0 0 8px 0;font-size:15px;">Hello {{to_name}},</p>
              <p style="margin:0 0 20px 0;font-size:15px;line-height:1.6;color:#5c6b7a;">
                Use this code to finish creating your Azure Bay guest account. It expires in 10 minutes.
              </p>
              <p style="margin:0;text-align:center;font-family:Georgia,'Times New Roman',serif;font-size:36px;letter-spacing:0.28em;color:#0b1f33;">
                {{otp_code}}
              </p>
              <p style="margin:24px 0 0 0;font-size:13px;line-height:1.5;color:#5c6b7a;">
                If you did not request this, you can ignore this email.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
